{% extends 'base.html' %}

{% block title %}Категории — Органайзер{% endblock %}

{% block content %}
<h5 class="mb-2">Мои категории</h5>

<form method="post" action="{{ url_for('categories') }}" class="row g-2 mb-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-5">
    <input type="text" name="name" class="form-control" maxlength="50"
           placeholder="Название категории" required>
  </div>
  <div class="col-md-3">
    <button type="submit" class="btn btn-primary w-100">Добавить</button>
  </div>
</form>

<table class="table table-hover table-bordered bg-white align-middle">
  <thead class="table-light">
    <tr>
      <th>Название</th>
      <th>Задач</th>
      <th style="width: 340px;">Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for cat in categories %}
    <tr>
      <td>{{ cat.name }}</td>
      <td>{{ cat.task_count }}</td>
      <td>
        <form method="post" action="{{ url_for('category_rename', category_id=cat.id) }}"
              class="d-flex gap-1 mb-1">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="text" name="name" class="form-control form-control-sm"
                 value="{{ cat.name }}" maxlength="50" required>
          <button type="submit" class="btn btn-sm btn-outline-primary">Переименовать</button>
        </form>
        <form method="post" action="{{ url_for('category_delete', category_id=cat.id) }}"
              onsubmit="return confirm('Удалить категорию? Её задачи останутся без категории.')">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="3" class="text-center text-muted">Категорий пока нет</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
