{% extends 'base.html' %}

{% block title %}{{ page_title }} — Органайзер{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">{{ page_title }}</h5>
        <form method="post" action="{{ action_url }}">
          <div class="mb-3">
            <label class="form-label">Название *</label>
            <input type="text" name="title" class="form-control" maxlength="200"
                   value="{{ form.title }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-control" rows="3">{{ form.description }}</textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Категория</label>
              <select name="category_id" class="form-select">
                <option value="">—</option>
                {% for cat in categories %}
                  <option value="{{ cat.id }}"
                          {{ 'selected' if form.category_id == cat.id|string else '' }}>{{ cat.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Приоритет</label>
              <select name="priority" class="form-select">
                {% for p in ['низкий', 'средний', 'высокий'] %}
                  <option value="{{ p }}"
                          {{ 'selected' if form.priority == p else '' }}>{{ p }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Дедлайн</label>
              <input type="date" name="deadline" class="form-control" value="{{ form.deadline }}">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Статус</label>
              <select name="status" class="form-select">
                {% for s in ['новая', 'в работе', 'выполнена'] %}
                  <option value="{{ s }}"
                          {{ 'selected' if form.status == s else '' }}>{{ s }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
